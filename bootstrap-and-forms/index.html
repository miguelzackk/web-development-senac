<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      .form-control.shadow-none:focus {
        border-color: #ced4da;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <main class="d-flex flex-wrap">
      <section
        class="col-12 col-md-6 d-flex flex-column justify-content-center align-items-center p-4"
        style="min-height: 100vh"
      >
        <div class="w-75">
          <h1 class="fw-medium text-dark mb-2 text-center">Bem-vindo!</h1>
          <p class="text-secondary text-center mb-4">
            Digite sua credencial para acessar a sua conta!
          </p>

          <form class="d-flex flex-column gap-3" action="/src/pages/form.html">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold"
                >Endereço de e-mail</label
              >
              <input
                type="email"
                id="email"
                class="form-control shadow-none"
                placeholder="Digite seu email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label fw-semibold">Senha</label>
              <input
                type="password"
                id="password"
                class="form-control shadow-none"
                placeholder="Senha"
                required
              />
            </div>
            <button
              type="submit"
              class="btn btn-warning w-100 fw-bold rounded-3"
            >
              Login
            </button>
          </form>
        </div>
      </section>

      <section class="col-12 col-md-6 p-0">
        <img
          src="/src/assets/images/psyduck.png"
          alt="foto do psyduck"
          style="width: 100%; height: 100vh; object-fit: cover"
        />
      </section>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
